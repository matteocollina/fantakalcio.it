name: Generate Hourly News Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: generate-hourly-news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout ytscribe
        uses: actions/checkout@v4
        with:
          repository: alexwbend/ytscribe
          ref: bd04947a93ce32ed173ec16561f8810f38af30fc
          path: .ytscribe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check --upgrade yt-dlp

      - name: Install dependencies
        run: npm ci

      - name: Generate hourly news digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          YTSCRIBE_PYTHON: python
          YTSCRIBE_SCRIPT_PATH: .ytscribe/scripts/ytscribe.py
          YTSCRIBE_LANG: it
        run: npm run generate:youtube-posts

      - name: Commit generated news digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare"
            exit 0
          fi
          git commit -m "chore: generate hourly news digest"
          git push
